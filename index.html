<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar DACTe</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #scan-button {
            background-color: #28a745;
        }
        #scan-button:hover {
            background-color: #218838;
        }
        #qr-reader {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            background: #000;
            overflow: hidden;
            position: relative;
        }
        #qr-reader video {
            touch-action: none;
            object-fit: cover;
        }
        #qr-reader__scan_region {
            min-height: 240px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Consultar DACTe</h2>
        <p>Escaneie o QR Code ou digite a chave de acesso para gerar o PDF:</p>
        
        <div id="qr-reader"></div>
        
        <button id="scan-button" onclick="toggleScanner()">Escanear QR Code</button>

        <input type="text" id="chaveDeAcesso" placeholder="A chave de acesso aparecerá aqui">
        <button onclick="redirecionar()">Gerar PDF</button>
    </div>

    <!-- Biblioteca de JavaScript para ler QR Code -->
    <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>

    <script>
        let html5QrCode = null;
        let cameraAtiva = false;

        // Variáveis de zoom por pinça e foco
        let zoomMin = 1;
        let zoomMax = 1;
        let zoomAtual = 1;
        let zoomStep = 0.1;
        let zoomDisponivel = false;
        let distanciaInicialPinch = 0;
        let zoomInicialPinch = 1;
        let ultimoZoomAplicado = 0;
        let aplicandoZoom = false;

        function toggleScanner() {
            if (!cameraAtiva) {
                startScanner();
            } else {
                stopScanner();
            }
        }

        // Função para iniciar o scanner com suporte otimizado
        function startScanner() {
            const qrReaderDiv = document.getElementById('qr-reader');
            qrReaderDiv.style.display = 'block';

            if (html5QrCode && html5QrCode.isScanning) {
                return;
            }
            
            html5QrCode = new Html5Qrcode("qr-reader", {
                useBarCodeDetectorIfSupported: true,
                formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
            });

            const config = { 
                fps: 20, 
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    const lado = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.78);
                    return { width: Math.max(180, lado), height: Math.max(180, lado) };
                },
                aspectRatio: 1.0,
                disableFlip: true,
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, (errorMessage) => {
                // Erros de leitura podem ser ignorados
            }).then(() => {
                cameraAtiva = true;
                const btn = document.getElementById('scan-button');
                btn.innerText = "Desligar Câmera";
                btn.style.backgroundColor = "#dc3545";
                setTimeout(prepararZoomManual, 700);
            }).catch(err => {
                console.warn("Tentando modo alternativo de câmera...", err);
                html5QrCode.start({ facingMode: "environment" }, {
                    fps: 15,
                    qrbox: (viewfinderWidth, viewfinderHeight) => {
                        const lado = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.75);
                        return { width: Math.max(180, lado), height: Math.max(180, lado) };
                    },
                    aspectRatio: 1.0,
                    disableFlip: true
                }, onScanSuccess).then(() => {
                    cameraAtiva = true;
                    const btn = document.getElementById('scan-button');
                    btn.innerText = "Desligar Câmera";
                    btn.style.backgroundColor = "#dc3545";
                    setTimeout(prepararZoomManual, 700);
                }).catch(e => {
                    console.error("Erro ao iniciar câmera:", e);
                    alert("Não foi possível iniciar a câmera.");
                    stopScanner();
                });
            });
        }

        async function prepararZoomManual() {
            zoomDisponivel = false;
            if (!html5QrCode || !cameraAtiva) return;

            try {
                const caps = html5QrCode.getRunningTrackCapabilities();
                const zoom = caps && caps.zoom;

                try {
                    await html5QrCode.applyVideoConstraints({
                        advanced: [{ focusMode: 'continuous' }]
                    });
                } catch (_) {}

                if (zoom && typeof zoom.min === 'number' &&
                    typeof zoom.max === 'number' && zoom.max > zoom.min) {
                    zoomMin = zoom.min;
                    zoomMax = zoom.max;
                    zoomStep = Number(zoom.step) || Math.max(0.1, (zoomMax - zoomMin) / 100);

                    const settings = html5QrCode.getRunningTrackSettings
                        ? html5QrCode.getRunningTrackSettings()
                        : {};
                    const zoomAtualCamera = settings && typeof settings.zoom === 'number'
                        ? settings.zoom : zoomMin;
                    const zoomInicialDesejado = Math.max(2, zoomMin + (zoomMax - zoomMin) * 0.20);
                    zoomAtual = Math.max(zoomMin, Math.min(zoomMax,
                        Math.max(zoomAtualCamera, zoomInicialDesejado)));
                    zoomDisponivel = true;

                    const aplicado = await aplicarZoomNativo(zoomAtual);
                    if (!aplicado) {
                        zoomAtual = zoomAtualCamera;
                        zoomDisponivel = false;
                    }
                } else {
                    zoomMin = 1;
                    zoomMax = 1;
                    zoomAtual = 1;
                }
            } catch (e) {
                zoomDisponivel = false;
                console.debug('Controles avançados da câmera indisponíveis:', e);
            }
        }

        async function aplicarZoomNativo(valor) {
            if (!html5QrCode) return false;
            try {
                await html5QrCode.applyVideoConstraints({
                    advanced: [{ zoom: valor }]
                });
                return true;
            } catch (_) {
                try {
                    await html5QrCode.applyVideoConstraints({ zoom: valor });
                    return true;
                } catch (e) {
                    return false;
                }
            }
        }

        function distanciaEntreDedos(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Ouvintes de pinça para zoom na tela de leitura
        setTimeout(() => {
            const areaCamera = document.getElementById('qr-reader');
            if (areaCamera) {
                areaCamera.style.touchAction = 'none';
                areaCamera.addEventListener('touchstart', (event) => {
                    if (!cameraAtiva || event.touches.length !== 2) return;
                    event.preventDefault();
                    distanciaInicialPinch = distanciaEntreDedos(event.touches);
                    zoomInicialPinch = zoomAtual;
                    ultimoZoomAplicado = 0;
                }, { passive: false });

                areaCamera.addEventListener('touchmove', (event) => {
                    if (!cameraAtiva || event.touches.length !== 2 || !distanciaInicialPinch) return;
                    event.preventDefault();
                    if (!zoomDisponivel || aplicandoZoom) return;
                    const distanciaAtual = distanciaEntreDedos(event.touches);
                    const escala = distanciaAtual / distanciaInicialPinch;
                    let novoZoom = Math.max(zoomMin, Math.min(zoomMax, zoomInicialPinch * escala));
                    novoZoom = Math.round(novoZoom / zoomStep) * zoomStep;
                    novoZoom = Math.max(zoomMin, Math.min(zoomMax, Number(novoZoom.toFixed(2))));
                    if (Math.abs(novoZoom - zoomAtual) < zoomStep || Date.now() - ultimoZoomAplicado < 90) return;

                    ultimoZoomAplicado = Date.now();
                    aplicandoZoom = true;
                    aplicarZoomNativo(novoZoom).then(aplicado => {
                        if (aplicado) zoomAtual = novoZoom;
                    }).finally(() => { aplicandoZoom = false; });
                }, { passive: false });

                const encerrarPinch = () => { distanciaInicialPinch = 0; };
                areaCamera.addEventListener('touchend', encerrarPinch, { passive: true });
                areaCamera.addEventListener('touchcancel', encerrarPinch, { passive: true });
            }
        }, 500);

        // Função chamada quando o QR Code é lido com sucesso
        function onScanSuccess(decodedText, decodedResult) {
            console.log(`URL do QR Code: ${decodedText}`);
            let chaveExtraida = '';

            try {
                const url = new URL(decodedText);
                const chave = url.searchParams.get("chCTe");

                if (chave) {
                    chaveExtraida = chave;
                    console.log(`Chave extraída da URL: ${chaveExtraida}`);
                } else {
                    chaveExtraida = decodedText;
                    console.warn("Parâmetro 'chCTe' não encontrado. Usando o texto completo.");
                }
            } catch (e) {
                chaveExtraida = decodedText;
                console.error("O conteúdo do QR Code não é uma URL válida. Usando o texto completo.");
            }

            document.getElementById('chaveDeAcesso').value = chaveExtraida;
            stopScanner();
        }
        
        function stopScanner() {
            if (html5QrCode && cameraAtiva) {
                html5QrCode.stop().then(() => {
                    cameraAtiva = false;
                    const btn = document.getElementById('scan-button');
                    btn.innerText = "Escanear QR Code";
                    btn.style.backgroundColor = "#28a745";
                    console.log("Scanner parado.");
                }).catch(err => {
                    cameraAtiva = false;
                    console.error("Falha ao parar o scanner.", err);
                });
            }
            document.getElementById('qr-reader').style.display = 'none';
        }

        function redirecionar() {
            var chave = document.getElementById('chaveDeAcesso').value.replace(/\D/g, '');

            if (chave) {
                var url = 'https://portal.smartonline.app/portal24hdacte/frm_gera_dacte.aspx?CHAVE=' + chave + '&GERA_PDF=SIM&TIPO=V';
                window.location.href = url;
            } else {
                alert('Por favor, escaneie ou digite uma chave de acesso.');
            }
        }
    </script>

</body>
</html>
